<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar QR Code</title>
    <link rel="icon" type="image/webp" href="fav-icon.webp">
    <link rel="apple-touch-icon" href="fav-icon.webp">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg-top: #f4f4f5;
            --bg-bottom: #d9dade;
            --text: #1d1d1f;
            --muted: #6e6e73;
            --stroke: #d2d2d7;
            --blue-top: #49a5ff;
            --blue-bottom: #0071e3;
            --blue-glow: rgba(0, 113, 227, .18);
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 28px 16px 36px;
            display: grid;
            place-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--text);
            background: radial-gradient(circle at top, rgba(255,255,255,.95), transparent 35%), linear-gradient(var(--bg-top), var(--bg-bottom));
            -webkit-font-smoothing: antialiased;
        }

        main { width: min(100%, 500px); }

        .window {
            overflow: hidden;
            border: .5px solid rgba(0,0,0,.12);
            border-radius: 16px;
            background: rgba(255,255,255,.92);
            box-shadow: 0 24px 80px rgba(0,0,0,.18), 0 6px 20px rgba(0,0,0,.08);
            backdrop-filter: blur(20px);
        }

        .title-bar {
            position: relative;
            height: 40px;
            display: flex;
            align-items: center;
            padding: 0 15px;
            border-bottom: .5px solid #b6b6bc;
            background: linear-gradient(#ececec, #d7d7d7);
        }

        .traffic-lights { display: flex; gap: 8px; }
        .dot { width: 12px; height: 12px; border: .5px solid rgba(0,0,0,.14); border-radius: 50%; }
        .red { background: #ff5f56; } .yellow { background: #ffbd2e; } .green { background: #27c93f; }

        .content { padding: 24px 22px 22px; }
        h1 { margin: 0 0 18px; font-size: 24px; letter-spacing: -.6px; }

        textarea {
            width: 100%; min-height: 104px; margin-bottom: 14px; padding: 14px;
            resize: vertical; border: 1px solid var(--stroke); border-radius: 12px;
            outline: none; background: #f9f9fb; color: var(--text); font: 15px/1.5 inherit;
            transition: border-color .2s, box-shadow .2s;
        }
        textarea:focus { border-color: var(--blue-bottom); box-shadow: 0 0 0 4px var(--blue-glow); }
        textarea.invalid { border-color: #ff5f56; }

        button { font: inherit; cursor: pointer; transition: transform .15s, box-shadow .2s, opacity .2s; }
        button:hover { transform: translateY(-1px); }
        button:active { transform: none; }

        .primary {
            width: 100%; padding: 12px 14px; border: 0; border-radius: 10px;
            color: #fff; font-size: 15px; font-weight: 600;
            background: linear-gradient(var(--blue-top), var(--blue-bottom));
            box-shadow: 0 10px 24px rgba(0,113,227,.18);
        }

        .result { margin-top: 22px; }
        .qr-preview { display: none; justify-content: center; margin-bottom: 18px; }
        .qr-preview.visible { display: flex; }
        #qrcode { width: 212px; height: 212px; padding: 12px; border: 1px solid #ececef; border-radius: 14px; background: #fff; }
        #qrcode canvas, #qrcode img { display: block; width: 100% !important; height: auto !important; }
        #qrcode.sticker-drop { animation: sticker-drop .56s cubic-bezier(.2, .85, .25, 1.2); }

        .export { display: flex; flex-direction: column; align-items: center; margin-top: 18px; padding-top: 4px; }
        .export.hidden { display: none; }
        .format-label { display: block; margin-bottom: 12px; color: #94949b; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
        .format-buttons { display: flex; width: max-content; max-width: 100%; gap: 10px; }
        .download {
            flex: 0 1 104px; padding: 10px 12px; border: 1px solid var(--stroke); border-radius: 10px;
            color: var(--text); font-size: 13px; font-weight: 700;
            background: linear-gradient(#fff, #f3f3f6); box-shadow: 0 2px 8px rgba(0,0,0,.05);
        }
        .download:disabled { opacity: .48; cursor: not-allowed; transform: none; }
        .status { min-height: 18px; margin: 10px 0 0; color: #b42318; font-size: 12px; line-height: 1.5; text-align: center; }

        footer { margin-top: 24px; color: var(--muted); font-size: 12px; text-align: center; }
        footer a { color: var(--blue-bottom); text-decoration: none; }
        @keyframes sticker-drop {
            0% { opacity: 0; transform: translateY(-28px) rotate(-5deg) scale(.82); }
            62% { opacity: 1; transform: translateY(4px) rotate(1.4deg) scale(1.025); }
            100% { opacity: 1; transform: translateY(0) rotate(0) scale(1); }
        }
        @media (max-width: 560px) { .content { padding: 20px 18px 18px; } h1 { font-size: 22px; } }
    </style>
</head>
<body>
    <main>
        <section class="window" aria-labelledby="page-title">
            <header class="title-bar">
                <div class="traffic-lights" aria-hidden="true"><i class="dot red"></i><i class="dot yellow"></i><i class="dot green"></i></div>
            </header>
            <div class="content">
                <h1 id="page-title">Gerar QR Code</h1>
                <textarea id="contentInput" placeholder="Cole ou digite o conteúdo aqui" aria-label="Conteúdo do QR Code"></textarea>
                <button class="primary" id="generateButton" type="button">Gerar QR Code</button>

                <div class="result" id="result">
                    <div class="qr-preview" id="qrPreview"><div id="qrcode" aria-label="Prévia do QR Code"></div></div>
                    <div class="export hidden" id="exportArea">
                        <span class="format-label">Baixar imagem</span>
                        <div class="format-buttons">
                            <button class="download" type="button" data-format="png" disabled>PNG</button>
                            <button class="download" type="button" data-format="jpeg" disabled>JPG</button>
                            <button class="download" type="button" data-format="svg" disabled>SVG</button>
                        </div>
                        <p class="status" id="status" role="status" aria-live="polite"></p>
                    </div>
                </div>
            </div>
        </section>
        <footer>Created by <a href="https://mateusfrmacedo.github.io/" target="_blank" rel="noreferrer">Mateus</a></footer>
    </main>

    <script>
        const input = document.getElementById("contentInput");
        const qrElement = document.getElementById("qrcode");
        const preview = document.getElementById("qrPreview");
        const exportArea = document.getElementById("exportArea");
        const status = document.getElementById("status");
        const downloadButtons = document.querySelectorAll("[data-format]");

        document.getElementById("generateButton").addEventListener("click", generateQrCode);
        input.addEventListener("keydown", (event) => {
            if ((event.metaKey || event.ctrlKey) && event.key === "Enter") generateQrCode();
        });
        downloadButtons.forEach((button) => {
            button.addEventListener("click", () => downloadQrCode(button.dataset.format));
        });

        function generateQrCode() {
            const text = input.value.trim();
            if (!text) {
                input.classList.add("invalid");
                input.focus();
                window.setTimeout(() => input.classList.remove("invalid"), 1600);
                return;
            }

            try {
                qrElement.replaceChildren();
                new QRCode(qrElement, {
                    text,
                    typeNumber: 0,
                    width: 1000,
                    height: 1000,
                    colorDark: "#000000",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.L
                });
                preview.classList.add("visible");
                qrElement.classList.remove("sticker-drop");
                void qrElement.offsetWidth;
                qrElement.classList.add("sticker-drop");
                exportArea.classList.remove("hidden");
                downloadButtons.forEach((button) => { button.disabled = false; });
                status.textContent = "";
            } catch (error) {
                qrElement.replaceChildren();
                preview.classList.remove("visible");
                exportArea.classList.add("hidden");
                downloadButtons.forEach((button) => { button.disabled = true; });
                status.textContent = "O conteúdo é grande demais para um QR Code. Reduza o texto e tente novamente.";
            }
        }

        function downloadQrCode(format) {
            const canvas = qrElement.querySelector("canvas");
            if (!canvas) return;
            const name = `qrcode_${Date.now()}`;

            if (format === "svg") {
                const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000"><rect width="100%" height="100%" fill="#fff"/><image width="1000" height="1000" href="${canvas.toDataURL("image/png")}"/></svg>`;
                save(URL.createObjectURL(new Blob([svg], { type: "image/svg+xml" })), `${name}.svg`);
                return;
            }

            if (format === "jpeg") {
                const jpegCanvas = document.createElement("canvas");
                jpegCanvas.width = jpegCanvas.height = 1000;
                const context = jpegCanvas.getContext("2d");
                context.fillStyle = "#fff";
                context.fillRect(0, 0, 1000, 1000);
                context.drawImage(canvas, 0, 0);
                save(jpegCanvas.toDataURL("image/jpeg", 1), `${name}.jpeg`);
                return;
            }
            save(canvas.toDataURL("image/png"), `${name}.png`);
        }

        function save(url, filename) {
            const link = document.createElement("a");
            link.href = url;
            link.download = filename;
            link.click();
            if (url.startsWith("blob:")) window.setTimeout(() => URL.revokeObjectURL(url), 0);
        }
    </script>
</body>
</html>
